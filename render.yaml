# Render Blueprint — UFUQ staging/demo (provider-generated *.onrender.com URLs).
#
# Not production (Phase 18). Free instances sleep after ~15 idle minutes and
# take up to a minute to wake. See deploy/render/README.md for what each
# service is, the one-time steps, and what is still to configure.
#
# Secrets are generated by Render (`generateValue`) or taken from the managed
# database and Key Value instance — none are committed.

databases:
  - name: ufuq-staging-db
    plan: free
    postgresMajorVersion: '16'
    databaseName: ufuq_staging
    user: ufuq_owner
    ipAllowList: []

services:
  - type: keyvalue
    name: ufuq-staging-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # S3-compatible object storage (AD-02). Free instances have no persistent
  # disk: uploaded files and report exports are lost when it restarts.
  - type: web
    name: ufuq-staging-storage
    runtime: image
    plan: free
    image:
      url: docker.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    dockerCommand: minio server /data --address :9000
    envVars:
      - key: PORT
        value: '9000'
      - key: MINIO_ROOT_USER
        generateValue: true
      - key: MINIO_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: ufuq-staging-api
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable && corepack prepare pnpm@9.12.3 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm turbo run build --filter=@ufuq/api...
    startCommand: bash deploy/render/start-api.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: staging
      - key: DATABASE_MIGRATION_URL
        fromDatabase:
          name: ufuq-staging-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: ufuq-staging-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ufuq-staging-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ufuq-staging-db
          property: database
      - key: UFUQ_APP_DB_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ufuq-staging-redis
          property: connectionString
      - key: STORAGE_ENDPOINT
        value: https://ufuq-staging-storage.onrender.com
      - key: STORAGE_REGION
        value: us-east-1
      - key: STORAGE_BUCKET
        value: ufuq-staging
      - key: STORAGE_FORCE_PATH_STYLE
        value: 'true'
      - key: STORAGE_ACCESS_KEY_ID
        fromService:
          type: web
          name: ufuq-staging-storage
          envVarKey: MINIO_ROOT_USER
      - key: STORAGE_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: ufuq-staging-storage
          envVarKey: MINIO_ROOT_PASSWORD
      # No SMTP relay is configured for staging yet: sends fail fast against
      # an address nothing listens on, and CONTACT_TO stays unset so the public
      # contact form answers its safe 503. Set real values to enable mail.
      - key: SMTP_HOST
        value: 127.0.0.1
      - key: SMTP_PORT
        value: '1025'
      - key: SMTP_SECURE
        value: 'false'
      - key: MAIL_FROM
        value: Ufuq Staging <no-reply@ufuq.local>
      - key: WEB_ORIGIN
        value: https://ufuq-staging-web.onrender.com
      # Render's edge → Next.js rewrite → Render's edge → API.
      - key: TRUST_PROXY_HOPS
        value: '3'
      - key: DEMO_SEED
        value: 'true'

  - type: web
    name: ufuq-staging-web
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable && corepack prepare pnpm@9.12.3 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm turbo run build --filter=@ufuq/web...
    startCommand: cd apps/web && ./node_modules/.bin/next start
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Read at build time: the browser calls the API through this origin, and
      # the server forwards /api/v1 to the API (apps/web/next.config.mjs).
      - key: NEXT_PUBLIC_API_ORIGIN
        value: https://ufuq-staging-web.onrender.com
      - key: API_PROXY_TARGET
        value: https://ufuq-staging-api.onrender.com
      - key: WEB_ORIGIN
        value: https://ufuq-staging-web.onrender.com
