# UFUQ on this Mac — the whole product as one Docker Compose stack, published
# on the domain through a Cloudflare Tunnel (no open ports, no server).
#
#   Browser → Cloudflare (DNS, SSL) → Tunnel → cloudflared → caddy (:80)
#           → app: relay (:10000) → Next.js (:3000) → /api/v1 → NestJS API (:4000)
#           → postgres · redis · storage (SeaweedFS) · mailpit · backup (./backups)
#
# Start/update with:  bash deploy/mac/start.sh
# The site is online only while this Mac is awake and connected.

name: ufuq

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ufuq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ufuq
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ufuq -d ufuq']
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs noeviction: queued jobs must never be dropped for memory.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 30

  # S3-compatible file storage (uploads, report exports). SeaweedFS replaces
  # MinIO here: MinIO's images are no longer published on Docker Hub.
  storage:
    image: chrislusf/seaweedfs:4.45
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf '{"identities":[{"name":"ufuq","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # SMTP sink: accepts every message and delivers none, so invitation and
  # contact mail never fails. Its web UI is bound to the server's localhost
  # only (open it through an SSH tunnel). Replace SMTP_* in .env with a real
  # relay to send mail for real.
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'

  # Web app + API + relay in one container (the repository's Dockerfile and
  # deploy/hosted/start.sh). On every boot it applies migrations and the
  # reference seed, makes sure the storage bucket exists and, with
  # DEMO_SEED=true, seeds the demo company once.
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PUBLIC_ORIGIN: https://${UFUQ_DOMAIN:?set UFUQ_DOMAIN in .env}
    image: ufuq-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      # `staging` is the codebase's deployed mode with Secure cookies and the
      # demo company. `production` skips the demo data and the ufuq_app role
      # password (reserved for Phase 18), so it cannot run this stack.
      NODE_ENV: staging
      PUBLIC_ORIGIN: https://${UFUQ_DOMAIN}
      PORT: '10000'
      NODE_HEAP_MB: ${NODE_HEAP_MB:-512}
      DATABASE_MIGRATION_URL: postgresql://ufuq:${POSTGRES_PASSWORD}@postgres:5432/ufuq
      UFUQ_APP_DB_SECRET: ${UFUQ_APP_DB_SECRET:?set UFUQ_APP_DB_SECRET in .env}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ufuq
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Ufuq <no-reply@1to1os.com>}
      CONTACT_TO: ${CONTACT_TO:-}
      # Client IP for login rate limits and audit: caddy sets X-Forwarded-For
      # to the visitor (from Cloudflare's CF-Connecting-IP); the relay and
      # Next.js each append one hop after it.
      TRUST_PROXY_HOPS: '3'
      DEMO_SEED: ${DEMO_SEED:-true}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "Promise.all(['http://127.0.0.1:4000/api/v1/health','http://127.0.0.1:10000/'].map(u=>fetch(u,{redirect:'manual'}))).then(r=>process.exit(r.every(x=>x.status<500)?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Local check only: http://localhost:8080 on this Mac.
      - '127.0.0.1:8080:80'
    environment:
      UFUQ_DOMAIN: ${UFUQ_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Outbound-only connection to Cloudflare; the public hostnames
  # (domain and www → http://caddy:80) are set on the tunnel in the dashboard.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - caddy
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}

  # Daily PostgreSQL dump + file-storage archive into ./backups, pruned after
  # BACKUP_KEEP_DAYS. Restore with deploy/vps/restore.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ufuq
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ufuq
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-1}
    volumes:
      - ../vps/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - minio-data:/files:ro
    entrypoint: ['sh', '/backup.sh']

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
