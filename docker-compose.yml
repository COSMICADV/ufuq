# Local infrastructure for أُفق development.
#
# Approved architecture decisions this file implements:
#   AD-01  BullMQ + Redis        → redis
#   AD-02  S3-compatible storage → minio
#   AD-03  PostgreSQL RLS        → postgres (RLS is enabled from Phase 3)
#
# Approved Phase 5 decision (SMTP for transactional authentication mail):
#   mailpit — a local SMTP sink. It accepts every message and delivers none;
#   invitations sent in development are read at http://localhost:8025.
#
# Nothing here is a production topology. Production infrastructure is Phase 18.

name: ufuq

services:
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: ufuq-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # `ufuq` (below) is this container's bootstrap superuser — POSTGRES_USER is
  # always a superuser in the official image, which is also why it is the
  # right role for DATABASE_MIGRATION_URL and the wrong one for DATABASE_URL:
  # a superuser bypasses row-level security by definition, so the running API
  # must never authenticate as one (DOCUMENT 20 §3). The restricted `ufuq_app`
  # role that DATABASE_URL actually points at is created by the Phase 3
  # migration (`prisma migrate deploy`), and `prisma/seed.ts` sets its local
  # password the first time it runs — see `.env.example` for the full
  # explanation and both connection strings.
  postgres:
    image: postgres:16-alpine
    container_name: ufuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ufuq
      POSTGRES_PASSWORD: ufuq_local_password
      POSTGRES_DB: ufuq
      # Arabic collation matters for ORDER BY on names. C.UTF-8 keeps sorting
      # deterministic across platforms; collation policy is revisited in Phase 4.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ufuq -d ufuq']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ufuq-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: ufuq-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ufuq_local_access_key
      MINIO_ROOT_PASSWORD: ufuq_local_secret_key
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private bucket once, then exits. Attachments are never public
  # (DOCUMENT 20 §7): the bucket policy stays private and files are streamed
  # through an authorization-checked endpoint.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: ufuq-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ufuq_local_access_key ufuq_local_secret_key &&
      mc mb --ignore-existing local/ufuq-local &&
      mc anonymous set none local/ufuq-local &&
      echo 'bucket ufuq-local ready (private)'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
